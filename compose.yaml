services:
  playball:
    image: "ghcr.io/hangyeol0516/kbo-game-predictor:${PLAYBALL_IMAGE_TAG:-latest}"
    pull_policy: always
    container_name: kbo-game-predictor
    restart: unless-stopped
    ports:
      - "${PLAYBALL_PORT:-8000}:8000"
    environment:
      PLAYBALL_ODDS_API_KEY: "${PLAYBALL_ODDS_API_KEY:-}"
      PLAYBALL_ODDS_REGIONS: "${PLAYBALL_ODDS_REGIONS:-eu}"
      PLAYBALL_ODDS_CACHE_SECONDS: "${PLAYBALL_ODDS_CACHE_SECONDS:-3600}"
      PLAYBALL_ODDS_MIN_BOOKMAKERS: "${PLAYBALL_ODDS_MIN_BOOKMAKERS:-2}"
      PLAYBALL_ODDS_MAX_AGE_MINUTES: "${PLAYBALL_ODDS_MAX_AGE_MINUTES:-60}"
      PLAYBALL_ODDS_CLOSE_BEFORE_MINUTES: "${PLAYBALL_ODDS_CLOSE_BEFORE_MINUTES:-10}"
      PLAYBALL_UPSET_MIN_EV: "${PLAYBALL_UPSET_MIN_EV:-0.08}"
      PLAYBALL_UPSET_MIN_EDGE: "${PLAYBALL_UPSET_MIN_EDGE:-0.05}"
      PLAYBALL_UPSET_MIN_ADVANTAGE: "${PLAYBALL_UPSET_MIN_ADVANTAGE:-0.10}"
      PLAYBALL_ANALYSIS_CACHE_SECONDS: "${PLAYBALL_ANALYSIS_CACHE_SECONDS:-600}"
      PLAYBALL_ANALYSIS_CACHE_ENTRIES: "${PLAYBALL_ANALYSIS_CACHE_ENTRIES:-32}"
      PLAYBALL_MAX_CONCURRENT_ANALYSES: "${PLAYBALL_MAX_CONCURRENT_ANALYSES:-4}"
      PLAYBALL_COLLECT_INTERVAL_SECONDS: "${PLAYBALL_COLLECT_INTERVAL_SECONDS:-900}"
      PLAYBALL_COLLECTOR_ENABLED: "${PLAYBALL_COLLECTOR_ENABLED:-1}"
      PLAYBALL_RESULT_LOOKBACK_DAYS: "${PLAYBALL_RESULT_LOOKBACK_DAYS:-30}"
      PLAYBALL_REFRESH_TOKEN: "${PLAYBALL_REFRESH_TOKEN:-}"
    volumes:
      - playball_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  playball_data:
