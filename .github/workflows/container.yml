name: Container image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q server.py kbo_analysis.py storage.py scripts tests
      - name: Check browser JavaScript
        run: node --check app.js
      - name: Test browser interactions and recommendation expiration
        run: node --test tests/test_app.js
      - name: Validate Compose configuration
        run: docker compose config >/dev/null
      - name: Build and smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          docker build -t playball:test .
          docker run -d --name playball-smoke -e PLAYBALL_COLLECTOR_ENABLED=0 -p 127.0.0.1:18080:8000 playball:test
          trap 'docker logs playball-smoke || true; docker rm -f playball-smoke >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          for _ in range(40):
              try:
                  with urlopen("http://127.0.0.1:18080/health", timeout=2) as response:
                      payload = json.load(response)
                  assert payload["status"] == "ok", payload
                  break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("container did not become healthy")
          PY
          docker exec playball-smoke python scripts/backtest.py --help >/dev/null
          npm install --prefix "$RUNNER_TEMP/playball-ui" --no-save playwright@1.63.0 @axe-core/playwright@4.13.0
          "$RUNNER_TEMP/playball-ui/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/playball-ui/node_modules" \
            PLAYBALL_UI_ARTIFACT_DIR="$RUNNER_TEMP/playball-ui-artifacts" \
            node tests/test_ui.cjs

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag
      - name: Build and publish image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
